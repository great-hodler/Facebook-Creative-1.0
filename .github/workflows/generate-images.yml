name: Generate Batch Images

# Runs automatically on every push to the creative production branch.
# Scans output/*/image-prompt.json files for missing .jpg images,
# calls kie.ai Nano Banana Pro API to generate them, then commits back.
#
# SETUP REQUIRED: Add KIE_API_KEY as a GitHub Actions secret:
#   Repository → Settings → Secrets and variables → Actions → New repository secret
#   Name: KIE_API_KEY   Value: your_kie_api_key

on:
  push:
    branches:
      - "claude/facebook-ads-creative-system-pVJG0"

jobs:
  generate-images:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Write .env from secret
        env:
          KIE_API_KEY: ${{ secrets.KIE_API_KEY }}
        run: echo "KIE_API_KEY=${KIE_API_KEY}" > .env

      - name: Check for missing images
        id: check
        run: |
          missing=$(find output -name "image-prompt.json" | while read f; do
            dir=$(dirname "$f")
            if [ ! -f "$dir/image-1x1-final.jpg" ] || [ ! -f "$dir/image-9x16-final.jpg" ]; then
              echo "$dir"
            fi
          done | wc -l)
          echo "missing_count=$missing" >> $GITHUB_OUTPUT
          echo "Missing image sets: $missing"

      - name: Generate images
        if: steps.check.outputs.missing_count != '0'
        run: python3 generate_batch_images.py

      - name: Commit and push images
        if: steps.check.outputs.missing_count != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/**/*.jpg output/**/*.png 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No new images to commit."
          else
            git commit -m "ci: auto-generate batch images via kie.ai Nano Banana Pro"
            git push
          fi
